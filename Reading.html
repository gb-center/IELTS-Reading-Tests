<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS Reading – Practice Test 03 (Practice)</title>
<style>
:root{
  --bg:#ffffff; --pane:#ffffff; --alt:#f3f5f8; --text:#1b1f27; --muted:#59616f; --line:#d3d8e0;
  --head:#13233f; --headText:#ffffff; --accent:#1a5fb4; --accentSoft:#e4eefb; --brand:#d6001c;
  --ok:#17803a; --okBg:#e3f4e8; --bad:#b3261e; --badBg:#fce8e6; --hl:#ffe45c; --hlText:#000000; --flag:#e07b00;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161b; --pane:#1b1e25; --alt:#242831; --text:#e8eaee; --muted:#a3abb8; --line:#3a404c;
    --head:#0a1220; --headText:#ffffff; --accent:#6aa9ff; --accentSoft:#1d2b43; --brand:#e5253d;
    --ok:#6fd48a; --okBg:#15301f; --bad:#ff8a80; --badBg:#3b1c1a; --hl:#8a6d00; --hlText:#ffffff; --flag:#ffa733;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14161b; --pane:#1b1e25; --alt:#242831; --text:#e8eaee; --muted:#a3abb8; --line:#3a404c;
  --head:#0a1220; --headText:#ffffff; --accent:#6aa9ff; --accentSoft:#1d2b43; --brand:#e5253d;
  --ok:#6fd48a; --okBg:#15301f; --bad:#ff8a80; --badBg:#3b1c1a; --hl:#8a6d00; --hlText:#ffffff; --flag:#ffa733;
  color-scheme:dark;
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%; margin:0; background:var(--bg); color:var(--text);
  font-family:Arial,Helvetica,"Liberation Sans",sans-serif; display:flex; flex-direction:column; overflow:hidden}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--head); z-index:10}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,.divider:focus-visible{outline:3px solid var(--accent); outline-offset:1px}

/* header */
header{flex:none; background:var(--head); color:var(--headText); display:flex; align-items:center; gap:12px; padding:0 14px; height:52px}
.logo{background:var(--brand); color:#fff; font-weight:800; letter-spacing:.5px; padding:4px 9px; border-radius:3px; font-size:15px}
.title{font-size:14px; line-height:1.2}
.title small{display:block; opacity:.75; font-size:12px}
.spacer{flex:1}
.hbtn{background:transparent; border:1px solid rgba(255,255,255,.4); color:#fff; border-radius:4px; padding:5px 9px; font-size:13px}
.hbtn:hover{background:rgba(255,255,255,.14)}
.timer{display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; justify-content:center; font-variant-numeric:tabular-nums}
.timer.low{color:#ffb4ab}
.timer.hide #tt{visibility:hidden}

/* part strip */
.strip{flex:none; background:var(--alt); border-bottom:1px solid var(--line); padding:9px 16px; font-size:14px; display:flex; gap:12px; align-items:center}
.strip b{font-size:15px}
.viewtabs{display:none; margin-left:auto; gap:4px}
.viewtabs button{border:1px solid var(--line); background:var(--pane); border-radius:4px; padding:4px 10px; font-size:13px}
.viewtabs button[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:var(--accent)}

/* split */
main{flex:1; min-height:0; display:flex; --split:50%}
.pane{overflow:auto; background:var(--pane); padding:18px 26px 40px; font-size:calc(var(--fs,16) * 1px); line-height:1.6}
.passagepane{width:var(--split); flex:none}
.qpane{flex:1; min-width:0}
.divider{flex:none; width:9px; background:var(--alt); border-left:1px solid var(--line); border-right:1px solid var(--line); cursor:col-resize; position:relative; touch-action:none}
.divider::after{content:""; position:absolute; top:50%; left:2px; width:3px; height:36px; margin-top:-18px; background:var(--muted); border-radius:2px; opacity:.6}
article h2{font-size:1.35em; margin:.1em 0 .7em}
article p{margin:0 0 1em}
.lp{display:flex; gap:12px}
.plet{flex:none; width:1.7em; height:1.7em; display:inline-flex; align-items:center; justify-content:center; background:var(--alt); border:1px solid var(--line); border-radius:3px; font-weight:700; font-size:.9em; margin-top:.15em}
mark.hl{background:var(--hl); color:var(--hlText); padding:0; cursor:pointer}

/* questions */
.ghead{margin:0 0 14px; padding-top:4px}
.ghead h3{margin:0 0 4px; font-size:1.05em}
.ghead p{margin:0 0 8px; font-style:italic}
.legend{border:1px solid var(--line); border-radius:4px; background:var(--alt); font-size:.92em; margin:8px 0}
.legend div{padding:6px 10px; border-bottom:1px solid var(--line)}
.legend div:last-child{border-bottom:0}
.people{border:1px solid var(--line); background:var(--alt); border-radius:4px; padding:8px 12px; margin:8px 0; font-weight:600; line-height:1.8}
.q{display:flex; gap:12px; padding:12px 10px; margin:0 -10px 6px; border-radius:6px; border:2px solid transparent; position:relative}
.q.cur{border-color:var(--accent)}
.q.pulse{animation:pulse 1s ease-out}
@keyframes pulse{0%{background:var(--accentSoft)}100%{background:transparent}}
.qn{flex:none; width:2em; height:2em; border:2px solid var(--text); border-radius:3px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.9em}
.qb{flex:1; min-width:0}
.qt{margin:.1em 0 .6em}
.opts{display:flex; flex-direction:column; gap:4px}
.opt{display:flex; align-items:flex-start; gap:10px; padding:6px 10px; border:1px solid var(--line); border-radius:5px; cursor:pointer; background:var(--pane)}
.opt:hover{background:var(--accentSoft)}
.opt input{margin-top:.35em; accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent); background:var(--accentSoft)}
.opt .l{font-weight:700; margin-right:2px}
input.gap{font:inherit; padding:4px 8px; border:2px solid var(--line); border-radius:4px; width:11em; background:var(--pane); color:var(--text)}
input.gap:focus{border-color:var(--accent)}
select.sel{font:inherit; padding:6px 8px; border:2px solid var(--line); border-radius:4px; background:var(--pane); color:var(--text); min-width:9em}
.flag{flex:none; align-self:flex-start; background:transparent; border:1px solid var(--line); border-radius:4px; width:32px; height:32px; font-size:15px; color:var(--muted)}
.flag[aria-pressed="true"]{background:var(--flag); border-color:var(--flag); color:#fff}
.fb{margin-top:8px; font-size:.9em; font-weight:700}
.q.right{background:var(--okBg)} .q.right .fb{color:var(--ok)}
.q.wrong{background:var(--badBg)} .q.wrong .fb{color:var(--bad)}
.opt.correct{border-color:var(--ok); background:var(--okBg)}
.opt.wrong{border-color:var(--bad); background:var(--badBg)}
input.gap.bad,select.sel.bad{border-color:var(--bad)} input.gap.good,select.sel.good{border-color:var(--ok)}

/* bottom nav */
footer{flex:none; background:var(--pane); border-top:2px solid var(--line); display:flex; align-items:center; gap:10px; padding:8px 12px; min-height:52px}
#nav{flex:1; display:flex; gap:10px; align-items:center; overflow-x:auto; min-width:0}
.pgrp{display:flex; align-items:center; gap:6px; flex:none}
.pgrp.active{border:2px solid var(--accent); border-radius:6px; padding:3px 8px; background:var(--accentSoft)}
.pgrp.sum{background:var(--alt); border:1px solid var(--line); border-radius:6px; padding:7px 12px; font-size:13px}
.pgrp.sum .cnt{color:var(--muted)}
.plabel{font-weight:700; font-size:14px; margin-right:4px}
.nb{min-width:32px; height:32px; border:1px solid var(--line); background:var(--pane); border-radius:4px; font-size:13px; font-weight:700; position:relative; padding:0 4px}
.nb.ans{background:var(--accent); color:#fff; border-color:var(--accent)}
.nb.cur{outline:3px solid var(--text); outline-offset:1px}
.nb.fl::after{content:"⚑"; position:absolute; top:-9px; right:-4px; font-size:13px; color:var(--flag)}
.nb.ok{background:var(--ok); color:#fff; border-color:var(--ok)}
.nb.no{background:var(--bad); color:#fff; border-color:var(--bad)}
.ctl{display:flex; gap:6px; flex:none}
.cbtn{height:36px; min-width:40px; border:1px solid var(--line); background:var(--alt); border-radius:5px; font-weight:700; padding:0 12px}
.cbtn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.cbtn:disabled{opacity:.4; cursor:default}

/* floating highlight bar */
#hlbar{position:fixed; z-index:30; display:none; background:#222; color:#fff; border-radius:6px; padding:4px; gap:4px; box-shadow:0 4px 14px rgba(0,0,0,.35)}
#hlbar button{background:transparent; border:0; color:#fff; padding:6px 10px; border-radius:4px; font-size:13px}
#hlbar button:hover{background:#444}

/* overlay */
#ov{position:fixed; inset:0; background:rgba(8,14,26,.72); z-index:40; display:none; align-items:center; justify-content:center; padding:16px}
#ov.on{display:flex}
.card{background:var(--pane); color:var(--text); max-width:620px; width:100%; max-height:92%; overflow:auto; border-radius:10px; padding:26px 28px; box-shadow:0 14px 40px rgba(0,0,0,.4)}
.card h1{margin:0 0 4px; font-size:1.5em}
.card h2{margin:0 0 10px}
.card ul{padding-left:20px; line-height:1.7; margin:12px 0 18px}
.card .sub{color:var(--muted); margin:0 0 6px}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}
.score{font-size:3em; font-weight:800; line-height:1; margin:8px 0}
.score small{font-size:.35em; font-weight:600; color:var(--muted)}
.band{display:inline-block; background:var(--accent); color:#fff; font-weight:700; padding:3px 12px; border-radius:20px}
table.ps{border-collapse:collapse; width:100%; margin-top:14px}
table.ps td,table.ps th{border-bottom:1px solid var(--line); padding:7px 4px; text-align:left}
.note{font-size:12px; color:var(--muted); margin-top:12px}


.sw{display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer}
.sw input{accent-color:#6aa9ff; width:16px; height:16px}
.ptime{color:var(--muted); font-size:13px}
mark.ev{background:#ff9f43; color:#000; padding:0 1px; border-radius:2px}
.qtool{flex:none; background:var(--accentSoft); border-top:1px solid var(--line); padding:7px 12px; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; font-size:14px}
.qtool .qlab{font-weight:700; margin-right:2px}
.qtool .fbk{flex:1; min-width:140px; font-size:13px; color:var(--muted)}
.tbtn{height:32px; border:1px solid var(--line); background:var(--pane); border-radius:5px; padding:0 10px; font-size:13px}
.tbtn[aria-pressed="true"]{background:var(--flag); border-color:var(--flag); color:#fff}
.wrongs{margin-top:10px; display:flex; flex-wrap:wrap; gap:6px}
@media (max-width:800px){
  header .title small{display:none}
  .hbtn.opt-hide{display:none}
  .timer{min-width:0}
  .viewtabs{display:flex}
  .divider{display:none}
  .passagepane,.qpane{width:100%; flex:1}
  main[data-view="passage"] .qpane{display:none}
  main[data-view="questions"] .passagepane{display:none}
  .pane{padding:14px 16px 40px}
  .pgrp.sum .cnt{display:none}
  .card{padding:20px 18px}
}
</style>
</head>
<body>

<header>
  <span class="logo">IELTS</span>
  <div class="title"><b>Reading</b><small>Practice Test 03 · Practice mode</small></div>
  <div class="spacer"></div>
  <label class="sw" title="Check each answer as soon as you choose or type it"><input type="checkbox" id="instant" checked> Instant feedback</label><div class="timer" id="timer"><span aria-hidden="true">⏱</span><span id="tt">00:00</span><button class="hbtn" id="tPause">Pause</button><button class="hbtn" id="tHide" title="Show or hide the stopwatch">Hide</button></div>
  <button class="hbtn" id="fMinus" aria-label="Smaller text">A−</button>
  <button class="hbtn" id="fPlus" aria-label="Larger text">A+</button>
  <button class="hbtn opt-hide" id="themeBtn" aria-label="Switch light or dark">◐</button>
</header>

<div class="strip"><div id="stripTxt"></div>
  <div class="viewtabs"><button id="vtP" aria-pressed="true">Passage</button><button id="vtQ" aria-pressed="false">Questions</button></div>
</div>

<main id="split" data-view="passage">
  <section class="pane passagepane" id="passages" aria-label="Reading passage"></section>
  <div class="divider" id="divider" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Drag to resize"></div>
  <section class="pane qpane" id="qroot" aria-label="Questions"></section>
</main>

<div class="qtool" id="qtool"></div>

<footer>
  <div id="nav"></div>
  <div class="ctl">
    <button class="cbtn" id="prev" aria-label="Previous question">◀</button>
    <button class="cbtn" id="next" aria-label="Next question">▶</button>
    <button class="cbtn" id="chkPart">Check part</button>
    <button class="cbtn primary" id="submit">✓ Submit all</button>
  </div>
</footer>

<div id="hlbar"><button id="hlOn">Highlight</button><button id="hlOff">Clear</button></div>
<div id="ov"><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

<script>
/* ============ DATA ============ */
var TFNG_LEGEND = '<div class="legend"><div><b>TRUE</b> – if the statement agrees with the information</div><div><b>FALSE</b> – if the statement contradicts the information</div><div><b>NOT GIVEN</b> – if there is no information on this</div></div>';
var TFNG_INSTR = "Do the following statements agree with the information given in the text?";

var PARTS = [
 { intro:"You should spend about 20 minutes on Questions 1–13, which are based on Reading Passage 1 below.",
   from:1, to:13, title:"Daydreaming", lettered:false,
   paras:[
    "Everyone daydreams sometimes. We sit or lie down, close our eyes and use our imagination to think about something that might happen in the future or could have happened in the past. Most daydreaming is pleasant. We would like the daydream to happen and we would be very happy if it did actually happen. We might daydream that we are in another person’s place, or doing something that we have always wanted to do, or that other people like or admire us much more than they normally do.",
    "Daydreams are not dreams, because we can only daydream if we are awake. Also, we choose what our daydreams will be about, which we cannot usually do with dreams. With many daydreams, we know that what we imagine is unlikely to happen. At least, if it does happen, it probably will not do so in the way we want it to. However, some daydreams are about things that are likely to happen. With these, our daydreams often help us to work out what we want to do, or how to do it to get the best results. So, these daydreams are helpful. We use our imagination to help us understand the world and other people.",
    "Daydreams can help people to be creative. People in creative or artistic careers, such as composers, novelists and filmmakers, develop new ideas through daydreaming. This is also true of research scientists and mathematicians. In fact, Albert Einstein said that imagination is more important than knowledge because knowledge is limited whereas imagination is not.",
    "Research in the 1980s showed that most daydreams are about ordinary, everyday events. It also showed that over 75% of workers in so-called ‘boring jobs’, such as lorry drivers and security guards, spend a lot of time daydreaming in order to make their time at work more interesting. Recent research has also shown that daydreaming has a positive effect on the brain. Experiments with MRI brain scans show that the parts of the brain linked with complex problem-solving are more active during daydreaming. Researchers conclude that daydreaming is an activity in which the brain consolidates learning. In this respect, daydreaming is the same as dreaming during sleep.",
    "Although there do seem to be many advantages with daydreaming, in many cultures it is considered a bad thing to do. One reason for this is that when you are daydreaming, you are not working. In the 19th century, for example, people who daydreamed a lot were judged to be lazy. This happened in particular when people started working in factories on assembly lines. When you work on an assembly line, all you do is one small task again and again, every time exactly the same. It is rather repetitive and, obviously, you cannot be creative. So many people decided that there was no benefit in daydreaming.",
    "Other people have said that daydreaming leads to ‘escapism’ and that this is not healthy, either. Escapist people spend a lot of time living in a dream world in which they are successful and popular, instead of trying to deal with the problems they face in the real world. Such people often seem to be unhappy and are unable or unwilling to improve their daily lives. Indeed, recent studies show that people who often daydream have fewer close friends than other people. In fact, they often do not have any close friends at all."
   ],
   groups:[
    { range:"Questions 1–8", instr:TFNG_INSTR, type:"tfng", extra:TFNG_LEGEND, items:[
      {n:1,t:"People usually daydream when they are walking around."},
      {n:2,t:"Some people can daydream when they are asleep."},
      {n:3,t:"Some daydreams help us to be more successful in our lives."},
      {n:4,t:"Most lorry drivers daydream in their jobs to make them more interesting."},
      {n:5,t:"Factory workers daydream more than lorry drivers."},
      {n:6,t:"Daydreaming helps people to be creative."},
      {n:7,t:"Old people daydream more than young people."},
      {n:8,t:"Escapist people are generally very happy."} ]},
    { range:"Questions 9–10", instr:"Complete the sentences below. Choose NO MORE THAN THREE WORDS from the text for each answer.", type:"gap", items:[
      {n:9,pre:"Writers, artists and other creative people use daydreaming to",post:""},
      {n:10,pre:"The areas of the brain used in daydreaming are also used for complicated",post:""} ]},
    { range:"Questions 11–13", instr:"Choose the correct letter, A, B, C or D.", type:"mcq", items:[
      {n:11,t:"Daydreams are",o:["dreams that we have when we fall asleep in daytime.","about things that happened that make us sad.","often about things that we would like to happen.","activities that only a few people are able to do."]},
      {n:12,t:"In the nineteenth century, many people believed that daydreaming was",o:["helpful in factory work.","a way of avoiding work.","something that few people did.","a healthy activity."]},
      {n:13,t:"People who daydream a lot",o:["usually have creative jobs.","are much happier than other people.","are less intelligent than other people.","do not have as many friends as other people."]} ]}
   ]},
 { intro:"You should spend about 20 minutes on Questions 14–25, which are based on Reading Passage 2 below.",
   from:14, to:25, title:"Tricky Sums and Psychology", lettered:true,
   paras:[
    "In their first years of studying mathematics at school, children all over the world usually have to learn the times table, also known as the multiplication table, which shows what you get when you multiply numbers together. Children have traditionally learned their times table by going from ‘1 times 1 is 1’ all the way up to ‘12 times 12 is 144’.",
    "Times tables have been around for a very long time now. The oldest known tables using base 10 numbers, the base that is now used everywhere in the world, are written on bamboo strips dating from 305 BC, found in China. However, in many European cultures the times table is named after the Ancient Greek mathematician and philosopher Pythagoras (570–495 BC). And so it is called the Table of Pythagoras in many languages, including French and Italian.",
    "In 1820, in his book The Philosophy of Arithmetic, the mathematician John Leslie recommended that young pupils memorise the times table up to 25 x 25. Nowadays, however, educators generally believe it is important for children to memorise the table up to 9 x 9, 10 x 10 or 12 x 12.",
    "The current aim in the UK is for school pupils to know all their times tables up to 12 x 12 by the age of nine. However, many people do not know them, even as adults. Recently, some politicians have been asked arithmetical questions of this kind. For example, in 1998, the schools minister Stephen Byers was asked the answer to 7 x 8. He got the answer wrong, saying 54 rather than 56, and everyone laughed at him.",
    "In 2014, a young boy asked the UK Chancellor George Osborne the exact same question. As he had passed A-level maths and was in charge of the UK’s economic policies at the time, you would expect him to know the answer. However, he simply said, ‘I’ve made it a rule in life not to answer such questions.’",
    "Why would a politician refuse to answer such a question? It is certainly true that some sums are much harder than others. Research has shown that learning and remembering sums involving 6, 7, 8 and 9 tends to be harder than remembering sums involving other numbers. And it is even harder when 6, 7, 8 and 9 are multiplied by each other. Studies often find that the hardest sum is 6 x 8, with 7 x 8 not far behind. However, even though 7 x 8 is a relatively difficult sum, it is unlikely that George Osborne did not know the answer. So there must be some other reason why he refused to answer the question.",
    "The answer is that Osborne was being ‘put on the spot’ and he didn’t like it. It is well known that when there is a lot of pressure to do something right, people often have difficulty doing something that they normally find easy. When you put someone on the spot and ask such a question, it causes stress. The person’s heart beats faster and their adrenalin levels go up. As a result, people will often make mistakes that they would not normally make. This is called ‘choking’. Choking often happens in sport, such as when a footballer takes a crucial penalty. In the same way, the boy’s question put Osborne under great pressure. He knew it would be a disaster for him if he got the answer to such a simple question wrong and feared that he might choke. And that is why he refused to answer the question."
   ],
   groups:[
    { range:"Questions 14–19", instr:"The text has seven paragraphs, A–G. Which paragraph contains the following information?", type:"para", opts:["A","B","C","D","E","F","G"], items:[
      {n:14,t:"a 19th-century opinion of what children should learn"},
      {n:15,t:"the most difficult sums"},
      {n:16,t:"the effect of pressure on doing something"},
      {n:17,t:"how children learn the times table"},
      {n:18,t:"a politician who got a sum wrong"},
      {n:19,t:"a history of the times table"} ]},
    { range:"Questions 20–25", instr:TFNG_INSTR, type:"tfng", extra:TFNG_LEGEND, items:[
      {n:20,t:"Pythagoras invented the times table in China."},
      {n:21,t:"Stephen Byers and George Osborne were asked the same question."},
      {n:22,t:"All children in the UK have to learn the multiplication table."},
      {n:23,t:"George Osborne did not know the answer to 7 x 8."},
      {n:24,t:"7 x 8 is the hardest sum that children have to learn."},
      {n:25,t:"Stephen Byers got the sum wrong because he choked."} ]}
   ]},
 { intro:"You should spend about 20 minutes on Questions 26–40, which are based on Reading Passage 3 below.",
   from:26, to:40, title:"Care in the Community", lettered:false,
   paras:[
    "‘Bedlam’ is a word that has become synonymous in the English language with chaos and disorder. The term itself derives from the shortened name for a former 16th century London institution for the mentally ill, known as St. Mary of Bethlehem. This institution was so notorious that its name was to become a byword for mayhem. Patient ‘treatment’ amounted to little more than legitimised abuse. Inmates were beaten and forced to live in unsanitary conditions, whilst others were placed on display to a curious public as a side-show. There is little indication to suggest that other institutions founded at around the same time in other European countries were much better.",
    "Even up until the mid-twentieth century, institutions for the mentally ill were regarded as being more places of isolation and punishment than healing and solace. In popular literature of the Victorian era that reflected true-life events, individuals were frequently sent to the ‘madhouse’ as a legal means of permanently disposing of an unwanted heir or spouse. Later, in the mid-twentieth century, institutes for the mentally ill regularly carried out invasive brain surgery known as a ‘lobotomy’ on violent patients without their consent. The aim was to ‘calm’ the patient but ended up producing a patient that was little more than a zombie. Such a procedure is well documented to devastating effect in the film ‘One Flew Over the Cuckoo’s Nest’. Little wonder then that the appalling catalogue of treatment of the mentally ill led to a call for change from social activists and psychologists alike.",
    "Improvements began to be seen in institutions from the mid-50s onwards, along with the introduction of care in the community for less severely ill patients. Community care was seen as a more humane and purposeful approach to dealing with the mentally ill. Whereas institutionalised patients lived out their existence in confinement, forced to obey institutional regulations, patients in the community were free to live a relatively independent life. The patient was never left purely to their own devices as a variety of services could theoretically be accessed by the individual. In its early stages, however, community care consisted primarily of help from the patient’s extended family network. In more recent years, such care has extended to the provision of specialist community mental health teams (CMHTs) in the UK. Such teams cover a wide range of services from rehabilitation to home treatment and assessment. In addition, psychiatric nurses are on hand to administer prescription medication and give injections. The patient is therefore provided with the necessary help that they need to survive in the everyday world whilst maintaining a degree of autonomy.",
    "Often, though, when a policy is put into practice, its failings become apparent. This is true for the policy of care in the community. Whilst back-up services may exist, an individual may not call upon them when needed, due to reluctance or inability to assess their own condition. As a result, such an individual may be alone during a critical phase of their illness, which could lead them to self-harm or even become a threat to other members of their community. Whilst this might be an extreme-case scenario, there is also the issue of social alienation that needs to be considered. Integration into the community may not be sufficient to allow the individual to find work, leading to poverty and isolation. Social exclusion could then cause a relapse as the individual is left to battle mental health problems alone. The solution, therefore, is to ensure that the patient is always in touch with professional helpers and not left alone to fend for themselves. It should always be remembered that whilst you can take the patient out of the institution, you can’t take the institution out of the patient.",
    "When questioned about care in the community, there seems to be a division of opinion amongst members of the public and within the mental healthcare profession itself. Dr. Mayalla, practising clinical psychologist, is inclined to believe that whilst certain patients may benefit from care in the community, the scheme isn’t for everyone. ‘Those suffering moderate cases of mental illness stand to gain more from care in the community than those with more pronounced mental illness. I don’t think it’s a one-size-fits-all policy. But I also think that there is a far better infrastructure of helpers and social workers in place now than previously and the scheme stands a greater chance of success than in the past.’",
    "Anita Brown, mother of three, takes a different view. ‘As a mother, I’m very protective towards my children. As a result, I would not put my support behind any scheme that I felt might put my children in danger… I guess there must be assessment methods in place to ensure that dangerous individuals are not let loose amongst the public but I’m not for it at all. I like to feel secure where I live, but more to the point, that my children are not under any threat.’",

  });
}
document.addEventListener("mouseup", function(e){ if (e.target.closest("#hlbar")) return; setTimeout(function(){
  var s = getSelection();
  if (s.isCollapsed){ var m = e.target.closest && e.target.closest("mark.hl"); if (m){ hlMark = m; hlRange = null; showBar(m.getBoundingClientRect(), false); } else hideBar(); }
  else checkSel();
}, 0); });
document.addEventListener("touchend", function(){ setTimeout(checkSel, 250); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape") hideBar(); });
$("#passages").addEventListener("scroll", hideBar); $("#qroot").addEventListener("scroll", hideBar);
bar.addEventListener("mousedown", function(e){ e.preventDefault(); });
$("#hlOn").onclick = function(){ if (hlRange) highlight(hlRange); getSelection().removeAllRanges(); hideBar(); };
$("#hlOff").onclick = function(){
  if (hlMark) unwrap(hlMark); else if (hlRange){ document.querySelectorAll("mark.hl").forEach(function(m){ if (hlRange.intersectsNode(m)) unwrap(m); }); }
  getSelection().removeAllRanges(); hideBar();
};

/* ============ STOPWATCH ============ */
function updateTimer(){ $("#tt").textContent = fmtT(elapsed); $("#tPause").textContent = running ? "Pause" : "Resume"; }
function startTimer(){
  clearInterval(timerId); running = true; updateTimer();
  timerId = setInterval(function(){ if (!running) return; elapsed++; partTime[curPart]++; $("#tt").textContent = fmtT(elapsed); var pt = document.querySelector(".ptime"); if (pt) pt.textContent = "⏱ "+fmtT(partTime[curPart])+" / "+fmtT(SUGGESTED)+" suggested"; }, 1000);
}
$("#tPause").onclick = function(){ running = !running; updateTimer(); };
$("#tHide").onclick = function(){ var t = $("#timer"); t.classList.toggle("hide"); $("#tHide").textContent = t.classList.contains("hide") ? "Show" : "Hide"; };

/* ============ OVERLAY / RESULTS ============ */
function overlay(html){ $("#card").innerHTML = html; $("#ov").classList.add("on"); }
function closeOv(){ $("#ov").classList.remove("on"); }
function showIntro(){
  overlay('<h1>IELTS Reading</h1><p class="sub">Practice Test 03 · Practice mode</p><ul>' +
    '<li>There is <b>no countdown</b>. A stopwatch shows your total time and your time for each part (20 minutes per part is suggested). You can pause or hide it.</li>' +
    '<li><b>Instant feedback</b> (top right) checks each answer as soon as you choose or type it. Wrong answers are only marked red; the key is hidden unless you press <b>Show answer</b>. Turn it off to check by yourself with <b>Check</b> or <b>Check part</b>.</li>' +
    '<li><b>👁 Show answer</b> reveals the key. <b>🔎 Find evidence</b> highlights in orange the sentence in the passage that proves it. Not Given questions have no evidence.</li>' +
    '<li>Select text in a passage or question and choose <b>Highlight</b> to mark it. Click a highlight to clear it. Use ⚑ Flag for questions to review.</li>' +
    '<li>Press <b>Submit all</b> for your score, a list of mistakes, and a button to retry only the wrong answers.</li></ul>' +
    '<div class="btnrow"><button class="cbtn primary" id="start">Start practising</button></div>');
  $("#start").onclick = function(){ closeOv(); startTimer(); };
}
function bandOf(s){
  var t = [[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5]];
  for (var i=0;i<t.length;i++) if (s >= t[i][0]) return t[i][1];
  return "below 2.5";
}
function clearQ(n){
  delete ans[n]; delete checked[n]; delete revealed[n];
  var q = $("#q"+n);
  if (q) q.querySelectorAll("input,select").forEach(function(el){ if (el.type === "radio") el.checked = false; else el.value = ""; });
  paint(n);
}

/* ============ LMS SUBMISSION ============
   Paste the deployed Google Apps Script Web App URL into APPS_SCRIPT_URL.
   The request is sent as text/plain JSON to avoid a CORS preflight.
   Because mode is no-cors, the browser cannot read the server response.
*/
var LMS_SUBMISSION_CONFIG = {
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwLCP2F9eD49VGVxbHGhk58Xxk2uDf_wLvk95DTdAJdO-l9SiIl5CSAey2fR5QVMsv9bA/exec',
  classId: 'c11',
  studentId: 'STU_mvrr4rse_xyonx',
  assignmentId: 'W08_READING'
};
function sendAnswersToLMS() {
  var endpoint = LMS_SUBMISSION_CONFIG.APPS_SCRIPT_URL;
  if (!endpoint || endpoint.indexOf('PASTE_YOUR_') === 0) {
    console.warn('LMS submission is not configured: paste the Apps Script Web App URL first.');
    return;
  }
  var payload = {
    classId: LMS_SUBMISSION_CONFIG.classId,
    studentId: LMS_SUBMISSION_CONFIG.studentId,
    assignmentId: LMS_SUBMISSION_CONFIG.assignmentId,
    answers: ans,
    userAgent: navigator.userAgent
  };
  try {
    fetch(endpoint, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify(payload),
      keepalive: true
    }).catch(function(err) { console.error('Could not send answers to LMS:', err); });
  } catch (err) {
    console.error('Could not send answers to LMS:', err);
  }
}

function results(){
  var score = 0, per = [], wrong = [];
  for (var n=1;n<=TOTAL;n++) checked[n] = true;
  for (n=1;n<=TOTAL;n++) paint(n);
  PARTS.forEach(function(p,i){ var r = 0; for (var n=p.from;n<=p.to;n++){ if (isRight(n)) r++; else wrong.push(n); } per.push(r); score += r; });
  renderNav(); running = false; updateTimer();
  overlay('<h2>Your result</h2><div class="score">'+score+'<small> / 40</small></div><span class="band">Estimated band '+bandOf(score)+'</span>' +
    '<table class="ps"><tr><th>Part</th><th>Correct</th><th>Time</th></tr>' + PARTS.map(function(p,i){
      return '<tr><td>Part '+(i+1)+' (Q'+p.from+'–'+p.to+')</td><td>'+per[i]+' / '+(p.to-p.from+1)+'</td><td>'+fmtT(partTime[i])+'</td></tr>'; }).join("") +
    '<tr><td><b>Total</b></td><td></td><td><b>'+fmtT(elapsed)+'</b></td></tr></table>' +
    (wrong.length ? '<p style="margin:14px 0 4px"><b>Questions to review:</b> click a number to go to it.</p><div class="wrongs">' + wrong.map(function(n){ return '<button class="nb no" data-r="'+n+'">'+n+'</button>'; }).join("") + '</div>' : '<p><b>Perfect score – well done!</b></p>') +
    '<p class="note">The band is an approximate Academic Reading conversion; real tests may use slightly different tables.</p>' +
    '<div class="btnrow"><button class="cbtn primary" id="rv">Review answers</button>' + (wrong.length ? '<button class="cbtn" id="retry">Retry wrong answers</button>' : '') + '<button class="cbtn" id="reset">Start over</button></div>');
  $("#card").querySelectorAll("[data-r]").forEach(function(b){ b.onclick = function(){ closeOv(); go(+b.dataset.r); }; });
  $("#rv").onclick = function(){ closeOv(); go(wrong.length ? wrong[0] : 1); };
  if ($("#retry")) $("#retry").onclick = function(){ wrong.forEach(clearQ); clearEvidence(); running = true; updateTimer(); closeOv(); go(wrong[0]); };
  $("#reset").onclick = function(){ for (var n=1;n<=TOTAL;n++) clearQ(n); flags = {}; clearEvidence(); elapsed = 0; partTime = [0,0,0]; running = true; closeOv(); setPart(0); cur = 1; renderNav(); updateTimer(); };
}
$("#submit").onclick = function(){
  var un = 0; for (var n=1;n<=TOTAL;n++) if (!answered(n)) un++;
  overlay('<h2>Submit all answers?</h2><p>'+(un ? 'You have <b>'+un+'</b> unanswered question'+(un>1?'s':'')+'.' : 'You have answered all 40 questions.')+'</p><div class="btnrow"><button class="cbtn" id="bk">Keep practising</button><button class="cbtn primary" id="ys">Submit</button></div>');
  $("#bk").onclick = closeOv; $("#ys").onclick = function(){
    sendAnswersToLMS();
    results();
  };
};

/* ============ INIT ============ */
build(); setPart(0); renderNav(); $("#split").style.setProperty("--fs", fs); showIntro();
</script>
